name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: personal_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d personal_os_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: personal_os_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install
      - name: Run isolated PostgREST acceptance preflight tests
        run: npm run test:acceptance:preflight
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Replay core and Organization migrations with RLS checks
        run: |
          createdb personal_os_migration_test
          PGDATABASE=personal_os_migration_test bash supabase/tests/organization-migrations.sh
      - name: Verify Organization task hierarchy constraints
        run: bash supabase/tests/organization-task-hierarchy-concurrency.sh
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build
